[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens"
version = "0.1.0"
description = "Analyze your GitHub. Understand your career."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27",
    "sentence-transformers>=3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "google-genai>=1.0",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["devlens*"]

[tool.pytest.ini_options]
testpaths = ["devlens/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["devlens"]
omit = ["devlens/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["devlens"]
exclude = ["devlens/tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "faiss.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
